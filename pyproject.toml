[project]
name = "carepilot-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rifat211-debug", email = "salauddin.alrifat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langgraph>=1.2.22",
    "pgvector>=0.5.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
carepilot-ai = "carepilot_ai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
